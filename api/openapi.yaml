  /bookings:
    post:
      operationId: createBooking
      summary: Створення запиту на бронювання
      description: |
        Створює бронювання в статусі PENDING, фіксує час заїзду, час виїзду,
        технологічну перерву, відсоток комісії, вартість проживання й комісію
        (FR-06, FR-15) і операцію оплати передоплати; власник отримує
        повідомлення. Інші запити в PENDING на ті самі ночі створенню не
        заважають.

        Відмова не створює ні бронювання, ні платіжної операції й додає запис
        WARN із кодом до журналу подій. Перевірки FR-07 виконуються в порядку
        ACCOUNT_BLOCKED, MIN_NIGHTS, OWN_LISTING, GUESTS_OUT_OF_RANGE,
        LISTING_UNPUBLISHED, CHECKIN_TOO_SOON, DATES_UNAVAILABLE; повертається
        перший код, що спрацював. Тому схема не обмежує `guestsCount` і порядок
        дат: ці порушення мають власні коди, а не VALIDATION_FAILED.
