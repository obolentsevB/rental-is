openapi: 3.1.0
info:
  title: rental-is — внутрішній REST API
  version: 1.0.0
  description: |
    Внутрішній програмний інтерфейс між клієнтом і сервером (SRS v1.1, §5.2).
    Модель ресурсів, правила URI, перелік операцій і модель помилок —
    `docs/api-resources.md`; терміни й ідентифікатори полів — `spec/glossary.md`.

    **Розширення операцій**

    - `x-req-ids` — вимоги SRS із розділу 4 `docs/api-resources.md`.
    - `x-acceptance-criteria` — критерії прийняття цих вимог, які операція забезпечує.
    - `x-side-effects` — вимоги SRS, наслідки яких операція спричиняє, хоча вони
      не є її основною вимогою (запис журналу FR-22 — лише там, де він має
      окремий AC). Критерії прийняття цих вимог, які операція забезпечує,
      також входять до `x-acceptance-criteria`.
    - `x-roles` — хто може виконати операцію:
      `anonymous` — незареєстрований відвідувач;
      `guest` — обліковий запис, що діє як гість;
      `host` — обліковий запис, що діє як власник (власник конкретного
      житла — той, хто його опублікував);
      `moderator` — обліковий запис модератора;
      `blocked` — заблокований користувач (FR-01: вхід, свої повідомлення
      й поїздки, одне оскарження).

    **Помилки.** Усі відповіді 4xx і 5xx — `application/problem+json` зі схемою
    `Problem`. Перелік кодів закритий (`docs/api-resources.md`, розділ 5).
    Для створення запиту на бронювання перевірки FR-07 виконуються в порядку
    ACCOUNT_BLOCKED, MIN_NIGHTS, OWN_LISTING, GUESTS_OUT_OF_RANGE,
    LISTING_UNPUBLISHED, CHECKIN_TOO_SOON, DATES_UNAVAILABLE; повертається
    перший код, що спрацював, і HTTP-статус визначає саме він.

    **Час і гроші.** Ночі — дати `YYYY-MM-DD`; моменти — дата й час зі зсувом
    Europe/Kyiv; мітки часу журналу подій — UTC (NFR-07). Суми — UAH рядком
    з двома знаками після крапки (NFR-09).
servers:
  - url: http://127.0.0.1:4010
    description: Mock API (Prism)
security:
  - bearerAuth: []
tags:
  - name: Users
    description: Облікові записи і блокування (FR-01, FR-19)
  - name: Auth
    description: Сесія входу (FR-01, NFR-11)
  - name: Listings
    description: Картка житла, пошук, зняття з публікації (FR-02, FR-04, FR-05)
  - name: Availability
    description: Ночі, закриті власником (FR-03)
  - name: Bookings
    description: Запити й бронювання (FR-06–FR-09, FR-12, FR-13)
  - name: Payments
    description: Платіжні операції (FR-15, FR-16)
  - name: Reviews
    description: Відгуки (FR-17, FR-18)
  - name: Complaints
    description: Скарги на відгуки (FR-18)
  - name: Disputes
    description: Спори щодо скасування власником (FR-20)
  - name: Appeals
    description: Оскарження (FR-21)
  - name: Events
    description: Журнал подій (FR-22, NFR-06)
  - name: Notifications
    description: Повідомлення (FR-23)

paths:
  /users:
    post:
      operationId: registerUser
      summary: Реєстрація
      description: |
        Створює обліковий запис, який може діяти і як гість, і як власник.
        Облікові записи модераторів через API не створюються (NFR-10).
      tags: [Users]
      security: []
      x-req-ids: [FR-01]
      x-acceptance-criteria: [AC-01.1, AC-01.2, AC-01.5, AC-01.6]
      x-roles: [anonymous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            examples:
              registration:
                value:
                  email: maria@example.com
                  password: kyiv2027!
      responses:
        '201':
          description: Обліковий запис створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                registered:
                  value:
                    id: 2d8b5e4a-7c3f-4ea0-9b49-5f6a7b8c9da3
                    email: maria@example.com
                    roles: [GUEST, HOST]
                    status: ACTIVE
        '409':
          description: Email уже використовується (AC-01.1)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                email-taken:
                  value:
                    type: urn:rental-is:problem:email-taken
                    title: Email уже використовується
                    status: 409
                    code: EMAIL_TAKEN
                    detail: Обліковий запис з email maria@example.com уже існує.
                    correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
        '422':
          description: Запит порушує схему, зокрема пароль коротший за 8 символів (AC-01.2)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation-failed:
                  value:
                    type: urn:rental-is:problem:validation-failed
                    title: Запит порушує схему
                    status: 422
                    code: VALIDATION_FAILED
                    detail: 'password: щонайменше 8 символів, отримано 7.'
                    correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      operationId: getCurrentUser
      summary: Власний обліковий запис
      description: Доступна і заблокованому користувачу, щоб він бачив свій стан.
      tags: [Users]
      x-req-ids: [FR-01]
      x-acceptance-criteria: [AC-01.5]
      x-roles: [guest, host, moderator, blocked]
      responses:
        '200':
          description: Обліковий запис поточного користувача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                current-user:
                  value:
                    id: 2d8b5e4a-7c3f-4ea0-9b49-5f6a7b8c9da3
                    email: maria@example.com
                    roles: [GUEST, HOST]
                    status: ACTIVE
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}/block:
    parameters:
      - $ref: '#/components/parameters/userId'
    post:
      operationId: blockUser
      summary: Блокування
      description: |
        Модератор безстроково блокує обліковий запис з обов'язковою підставою.
        Наслідки FR-19 (приховування відгуків, зняття оголошень, відхилення
        запитів, скасування з ініціатором PLATFORM) виконує система в тій
        самій дії.
      tags: [Users]
      x-req-ids: [FR-19]
      x-acceptance-criteria: [AC-04.2, AC-04.3, AC-13.7, AC-14.3, AC-15.8, AC-18.4, AC-19.1, AC-19.2, AC-19.3, AC-19.4, AC-23.1]
      x-side-effects: [FR-04, FR-13, FR-14, FR-15, FR-18, FR-23]
      x-roles: [moderator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationReasonRequest'
            examples:
              block:
                value:
                  reason: Систематичні скасування підтверджених бронювань без пояснень.
      responses:
        '200':
          description: Обліковий запис заблоковано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                blocked:
                  value:
                    id: 0b6f3c2e-5a1d-4c8e-9f27-3d4e5a6b7c81
                    email: olena@example.com
                    roles: [GUEST, HOST]
                    status: BLOCKED
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Дія доступна лише модератору
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                forbidden:
                  $ref: '#/components/examples/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Обліковий запис уже заблоковано
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                state-conflict:
                  value:
                    type: urn:rental-is:problem:state-conflict
                    title: Дія неможлива в поточному стані
                    status: 409
                    code: STATE_CONFLICT
                    detail: Обліковий запис уже заблоковано.
                    correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
        '422':
          description: Немає підстави блокування (AC-19.1)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation-failed:
                  $ref: '#/components/examples/ReasonMissing'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/session:
    post:
      operationId: createSession
      summary: Вхід
      description: |
        Вхід за email і паролем; повертає токен для заголовка
        `Authorization: Bearer`. Заблокований користувач входить (FR-01).
        Після 5 невдалих спроб поспіль вхід обмежено на 15 хв (NFR-11).
        Пароль у відповідях не повертається ніколи.
      tags: [Auth]
      security: []
      x-req-ids: [FR-01, NFR-11]
      x-acceptance-criteria: [AC-01.3, AC-01.7, AC-22.3, AC-N11.2, AC-N11.3, AC-N11.4]
      x-side-effects: [FR-22]
      x-roles: [anonymous]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  email: maria@example.com
                  password: kyiv2027!
      responses:
        '201':
          description: Сесію створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                session:
                  value:
                    token: eyJhbGciOiJIUzI1NiJ9.c2Vzc2lvbg.dGVzdA
        '401':
          description: Неправильні email або пароль
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalid-credentials:
                  value:
                    type: urn:rental-is:problem:invalid-credentials
                    title: Неправильні email або пароль
                    status: 401
                    code: INVALID_CREDENTIALS
                    detail: Email або пароль неправильні.
                    correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
        '422':
          description: Запит порушує схему
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation-failed:
                  value:
                    type: urn:rental-is:problem:validation-failed
                    title: Запит порушує схему
                    status: 422
                    code: VALIDATION_FAILED
                    detail: "email: обов'язкове поле."
                    correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
        '429':
          description: Тимчасове обмеження входу після 5 невдалих спроб (NFR-11)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                login-restricted:
                  value:
                    type: urn:rental-is:problem:login-restricted
                    title: Вхід тимчасово обмежено
                    status: 429
                    code: LOGIN_RESTRICTED
                    detail: Після 5 невдалих спроб вхід можливий через 15 хвилин від п'ятої спроби.
                    correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteSession
      summary: Вихід
      description: Завершує сесію, токен якої передано в заголовку.
      tags: [Auth]
      x-req-ids: [FR-01]
      x-acceptance-criteria: []
      x-roles: [guest, host, moderator, blocked]
      responses:
        '204':
          description: Сесію завершено; тіла відповіді немає
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /listings:
    get:
      operationId: searchListings
      summary: Пошук житла
      description: |
        Вибірка житла в стані Published. Усі фільтри необов'язкові й
        поєднуються довільно. Місто — точний збіг без урахування регістру.
        Діапазон дат задається парою `checkIn` і `checkOut` і відбирає житло,
        що проходить повну перевірку доступності (FR-08) з технологічною
        перервою, чинною на момент пошуку. Інших фільтрів немає.
      tags: [Listings]
      security: []
      x-req-ids: [FR-05]
      x-acceptance-criteria: [AC-05.1, AC-05.2, AC-05.3, AC-05.4, AC-05.5]
      x-roles: [anonymous, guest, host, moderator]
      parameters:
        - name: city
          in: query
          schema:
            type: string
          example: Київ
        - name: checkIn
          in: query
          description: Дата заїзду; задається разом із checkOut.
          schema:
            type: string
            format: date
          example: '2027-06-12'
        - name: checkOut
          in: query
          description: Дата виїзду; задається разом із checkIn і пізніша за неї.
          schema:
            type: string
            format: date
          example: '2027-06-14'
        - name: guestsCount
          in: query
          description: Кількість осіб; лишається житло, де вона не перевищує maxGuests.
          schema:
            type: integer
            minimum: 1
          example: 2
        - name: priceMin
          in: query
          description: Нижня межа ціни за ніч, UAH.
          schema:
            $ref: '#/components/schemas/Money'
        - name: priceMax
          in: query
          description: Верхня межа ціни за ніч, UAH.
          schema:
            $ref: '#/components/schemas/Money'
        - name: sort
          in: query
          description: |
            `price_asc`, `price_desc` — за ціною за ніч; `rating_desc` — за
            неокругленою середньою оцінкою, житло без неприхованих відгуків у кінці.
          schema:
            type: string
            enum: [price_asc, price_desc, rating_desc]
      responses:
        '200':
          description: Житло, що відповідає фільтрам
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Listing'
              examples:
                search-results:
                  value:
                    - id: 4fad7a6c-9e5b-4ac2-9d6b-7b8c9daebfc5
                      title: Поділ
                      description: Світла квартира біля Контрактової площі.
                      city: Київ
                      address: вул. Сагайдачного, 1
                      maxGuests: 4
                      pricePerNight: '1234.56'
                      photos:
                        - id: d2c6a3f5-27e4-435b-8af4-a4b5c6d7e8fe
                          url: http://127.0.0.1:4010/photos/d2c6a3f5-27e4-435b-8af4-a4b5c6d7e8fe
                      checkInTime: '14:00'
                      checkOutTime: '11:00'
                      turnoverNights: 0
                      status: PUBLISHED
                      averageRating: 4.5
        '422':
          description: Параметри порушують схему або checkIn не раніше checkOut
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation-failed:
                  value:
                    type: urn:rental-is:problem:validation-failed
                    title: Запит порушує схему
                    status: 422
                    code: VALIDATION_FAILED
                    detail: checkIn і checkOut задаються разом.
                    correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createListing
      summary: Створення картки житла
      description: |
        Створює оголошення в стані Published. Відсутні checkInTime,
        checkOutTime і turnoverNights отримують 14:00, 11:00 і 0.
        Порушення вимог до фотографій (кількість, формат, розмір файлу) —
        відмова PHOTO_INVALID із записом WARN у журналі подій; оголошення не
        створюється.
      tags: [Listings]
      x-req-ids: [FR-02]
      x-acceptance-criteria: [AC-02.1, AC-02.2, AC-02.3, AC-02.4, AC-02.6, AC-02.7, AC-22.8]
      x-side-effects: [FR-22]
      x-roles: [host]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingRequest'
            examples:
              podil:
                $ref: '#/components/examples/ListingRequestPodil'
      responses:
        '201':
          description: Оголошення створено в стані Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
              examples:
                created:
                  $ref: '#/components/examples/ListingPodil'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Користувач заблокований або є модератором
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                account-blocked:
                  $ref: '#/components/examples/AccountBlocked'
                forbidden:
                  $ref: '#/components/examples/Forbidden'
        '422':
          description: Картка порушує схему або вимоги до фотографій
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation-failed:
                  $ref: '#/components/examples/ListingValidationFailed'
                photo-invalid:
                  $ref: '#/components/examples/PhotoInvalid'
        '500':
          $ref: '#/components/responses/InternalError'

  /listings/{listingId}:
    parameters:
      - $ref: '#/components/parameters/listingId'
    get:
      operationId: getListing
      summary: Картка житла
      description: |
        Доступна будь-кому, зокрема незареєстрованому відвідувачу; вхід
        необов'язковий. Без входу — лише житло в стані PUBLISHED. Власник із
        входом бачить своє житло в будь-якому стані; модератор бачить будь-яке
        житло (AC-04.6, AC-18.4).
      tags: [Listings]
      security:
        - {}
        - bearerAuth: []
      x-req-ids: [FR-02]
      x-acceptance-criteria: [AC-02.3, AC-04.6, AC-18.4]
      x-roles: [anonymous, guest, host, moderator]
      responses:
        '200':
          description: Картка житла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
              examples:
                podil:
                  $ref: '#/components/examples/ListingPodil'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceListing
      summary: Редагування картки
      description: |
        Повна заміна картки житла її власником. Фотографії, які лишаються,
        передаються посиланням на їхній `id`, нові — вмістом. Зміни не
        впливають на значення, зафіксовані в уже створених запитах і
        бронюваннях (FR-06). При відмові PHOTO_INVALID наявна картка не
        змінюється.
      tags: [Listings]
      x-req-ids: [FR-02]
      x-acceptance-criteria: [AC-02.1, AC-02.2, AC-02.3, AC-02.5, AC-02.6, AC-02.7, AC-22.8]
      x-side-effects: [FR-22]
      x-roles: [host]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingRequest'
            examples:
              podil-edit:
                value:
                  title: Поділ
                  description: Світла квартира біля Контрактової площі.
                  city: Київ
                  address: вул. Сагайдачного, 1
                  maxGuests: 4
                  pricePerNight: '1234.56'
                  photos:
                    - id: d2c6a3f5-27e4-435b-8af4-a4b5c6d7e8fe
                  checkInTime: '16:00'
                  checkOutTime: '10:00'
                  turnoverNights: 1
      responses:
        '200':
          description: Картку оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
              examples:
                updated:
                  value:
                    id: 4fad7a6c-9e5b-4ac2-9d6b-7b8c9daebfc5
                    title: Поділ
