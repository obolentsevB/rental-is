components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен із відповіді `POST /auth/session`.

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    listingId:
      name: listingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    bookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    reviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    complaintId:
      name: complaintId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    disputeId:
      name: disputeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    appealId:
      name: appealId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    date:
      name: date
      in: path
      required: true
      description: Ніч, YYYY-MM-DD (Europe/Kyiv).
      schema:
        type: string
        format: date
      example: '2027-06-20'
    openStatus:
      name: status
      in: query
      required: true
      description: Перелік звернень містить лише подані й ще не розглянуті (ADD-01).
      schema:
        type: string
        enum: [open]

  schemas:
    Id:
      type: string
      format: uuid
      description: Непрозорий ідентифікатор.
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      description: Сума в UAH з точністю 0,01 (NFR-09).
      examples: ['1234.56']
    Moment:
      type: string
      format: date-time
      description: Момент зі зсувом Europe/Kyiv (NFR-07).
    Night:
      type: string
      format: date
      description: Календарна дата YYYY-MM-DD (Europe/Kyiv).

    Problem:
      type: object
      description: |
        Помилка за RFC 9457. `correlationId` збігається з наскрізним
        ідентифікатором операції в журналі подій (FR-22).
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
          description: 'URN виду urn:rental-is:problem:<код у kebab-case>.'
        title:
          type: string
        status:
          type: integer
          enum: [401, 403, 404, 409, 422, 429, 500]
        code:
          type: string
          enum:
            - MIN_NIGHTS
            - GUESTS_OUT_OF_RANGE
            - CHECKIN_TOO_SOON
            - OWN_LISTING
            - ACCOUNT_BLOCKED
            - LISTING_UNPUBLISHED
            - DATES_UNAVAILABLE
            - PHOTO_INVALID
            - INVALID_CREDENTIALS
            - LOGIN_RESTRICTED
            - EMAIL_TAKEN
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - STATE_CONFLICT
            - INTERNAL_ERROR
        detail:
          type: string
          description: Пояснення; для INTERNAL_ERROR відсутнє.
        correlationId:
          $ref: '#/components/schemas/Id'
        conflictingBookingIds:
          type: array
          description: Лише для DATES_UNAVAILABLE — бронювання, з якими виник конфлікт (K-110).
          items:
            $ref: '#/components/schemas/Id'

    RegistrationRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    Session:
      type: object
      required: [token]
      properties:
        token:
          type: string
          readOnly: true
          description: Токен для заголовка Authorization.
    User:
      type: object
      required: [id, email, roles, status]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        roles:
          type: array
          readOnly: true
          items:
            type: string
            enum: [GUEST, HOST, MODERATOR]
        status:
          type: string
          readOnly: true
          enum: [ACTIVE, BLOCKED]

    NewPhoto:
      type: object
      required: [data]
      additionalProperties: false
      description: |
        Нова фотографія. JPEG або PNG, не більше 5 242 880 байтів після
        декодування; інакше — PHOTO_INVALID.
      properties:
        data:
          type: string
          contentEncoding: base64
    ExistingPhoto:
      type: object
      required: [id]
      additionalProperties: false
      description: Фотографія картки, яка лишається без змін (при редагуванні).
      properties:
        id:
          $ref: '#/components/schemas/Id'
    Photo:
      type: object
      required: [id, url]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
    ListingRequest:
      type: object
      required: [title, city, address, maxGuests, pricePerNight, photos]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        city:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        maxGuests:
          type: integer
          minimum: 1
          maximum: 20
        pricePerNight:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Від 0.01 до 1000000.00 включно.
        photos:
          type: array
          description: |
            Від 1 до 10 фотографій. Порушення кількості, формату чи розміру —
            PHOTO_INVALID, а не VALIDATION_FAILED (FR-02).
          items:
            oneOf:
              - $ref: '#/components/schemas/NewPhoto'
              - $ref: '#/components/schemas/ExistingPhoto'
        checkInTime:
          type: string
          pattern: '^(1[2-9]:[0-5]\d|20:00)$'
          default: '14:00'
          description: 12:00–20:00 включно, з точністю до хвилини.
        checkOutTime:
          type: string
          pattern: '^(0[89]:[0-5]\d|1[01]:[0-5]\d|12:00)$'
          default: '11:00'
          description: 08:00–12:00 включно, з точністю до хвилини.
        turnoverNights:
          type: integer
          enum: [0, 1]
          default: 0
    Listing:
      type: object
      required: [id, title, city, address, maxGuests, pricePerNight, photos, checkInTime, checkOutTime, turnoverNights, status, averageRating]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        title:
          type: string
        description:
          type: string
        city:
          type: string
        address:
          type: string
        maxGuests:
          type: integer
        pricePerNight:
          $ref: '#/components/schemas/Money'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        checkInTime:
          type: string
        checkOutTime:
          type: string
        turnoverNights:
          type: integer
        status:
          type: string
          readOnly: true
          enum: [PUBLISHED, UNPUBLISHED]
        averageRating:
          type: [number, 'null']
          readOnly: true
          description: |
            Неокруглене середнє оцінок неприхованих відгуків (FR-18); null —
            неприхованих відгуків немає.

    ClosedNight:
      type: object
      required: [date]
      properties:
        date:
          $ref: '#/components/schemas/Night'

    BookingRequest:
      type: object
      required: [listingId, checkIn, checkOut, guestsCount]
      additionalProperties: false
      properties:
        listingId:
          $ref: '#/components/schemas/Id'
        checkIn:
          $ref: '#/components/schemas/Night'
        checkOut:
          allOf: [{ $ref: '#/components/schemas/Night' }]
          description: Не пізніше за checkIn — MIN_NIGHTS.
        guestsCount:
          type: integer
          description: Поза 1…maxGuests житла — GUESTS_OUT_OF_RANGE.
    Booking:
      type: object
      required: [id, listingId, checkIn, checkOut, guestsCount, status, checkInTime, checkOutTime, turnoverNights, commissionRate, accommodationCost, commission, prepayment, checkInAt, checkOutAt, decisionDeadline, cancelledBy, cancelledAt, reviewDeadline]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        listingId:
          $ref: '#/components/schemas/Id'
        checkIn:
          $ref: '#/components/schemas/Night'
        checkOut:
          $ref: '#/components/schemas/Night'
        guestsCount:
          type: integer
        status:
          type: string
          readOnly: true
          enum: [PENDING, CONFIRMED, REJECTED, CANCELLED, COMPLETED]
        checkInTime:
          type: string
          readOnly: true
          description: Зафіксовано в момент створення запиту.
        checkOutTime:
          type: string
          readOnly: true
          description: Зафіксовано в момент створення запиту.
        turnoverNights:
          type: integer
          readOnly: true
          description: Зафіксовано в момент створення запиту.
        commissionRate:
          type: number
          readOnly: true
          description: Відсоток комісії, зафіксований у момент створення запиту.
        accommodationCost:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          readOnly: true
        commission:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          readOnly: true
        prepayment:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          readOnly: true
        checkInAt:
          allOf: [{ $ref: '#/components/schemas/Moment' }]
          readOnly: true
        checkOutAt:
          allOf: [{ $ref: '#/components/schemas/Moment' }]
          readOnly: true
        decisionDeadline:
          allOf: [{ $ref: '#/components/schemas/Moment' }]
          readOnly: true
        cancelledBy:
          type: [string, 'null']
          readOnly: true
          enum: [GUEST, HOST, PLATFORM, null]
        cancelledAt:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Момент скасування; від нього рахується строк подання спору (FR-20).
        reviewDeadline:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: |
            Moment або null. Для бронювання в COMPLETED — checkOutAt + 14 днів:
            до цього моменту доступна дія «залишити відгук» (AC-12.3, FR-17);
            для інших статусів — null.

    Payment:
      type: object
      description: Незмінний запис факту імітованої операції; статусів немає.
      required: [id, type, amount, accommodationAmount, commissionAmount, createdAt]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        type:
          type: string
          readOnly: true
          enum: [PREPAYMENT, REFUND, CHARGE, PAYOUT]
          description: 'PREPAYMENT — оплата; REFUND — повернення; CHARGE — стягнення; PAYOUT — виплата власнику.'
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          readOnly: true
        accommodationAmount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          readOnly: true
          description: Частина суми, що належить до вартості проживання (FR-15).
        commissionAmount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          readOnly: true
          description: Частина суми, що належить до комісії; для виплати завжди 0.00 (FR-16).
        createdAt:
          allOf: [{ $ref: '#/components/schemas/Moment' }]
          readOnly: true

    ReviewRequest:
      type: object
      required: [rating, text]
      additionalProperties: false
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          minLength: 10
          maxLength: 1000
    Review:
      type: object
      required: [id, bookingId, rating, text, visibility, hiddenReason, createdAt]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        bookingId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        rating:
          type: integer
        text:
          type: string
        visibility:
          type: string
          readOnly: true
          enum: [VISIBLE, HIDDEN]
        hiddenReason:
          type: [string, 'null']
          readOnly: true
          enum: [AUTHOR_BLOCKED, COMPLAINT, null]
        createdAt:
          allOf: [{ $ref: '#/components/schemas/Moment' }]
          readOnly: true
          description: Момент публікації; від нього рахуються 24 год редагування.

    Complaint:
      type: object
      required: [id, reviewId, status, decision, reason]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        reviewId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        status:
          type: string
          readOnly: true
          enum: [OPEN, DECIDED]
        decision:
          type: [string, 'null']
          readOnly: true
          enum: [KEEP, HIDE, null]
        reason:
          type: [string, 'null']
          readOnly: true
    ComplaintDecisionRequest:
      type: object
      required: [decision, reason]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [KEEP, HIDE]
        reason:
          type: string
          minLength: 1

    Dispute:
      type: object
      required: [id, bookingId, status, refundRate, reason]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        bookingId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        status:
          type: string
          readOnly: true
          enum: [OPEN, DECIDED]
        refundRate:
          type: [number, 'null']
          readOnly: true
          description: Підсумкова частка повернення, %, після рішення.
        reason:
          type: [string, 'null']
          readOnly: true
    DisputeDecisionRequest:
      type: object
      required: [refundRate, reason]
      additionalProperties: false
      properties:
        refundRate:
          type: number
          minimum: 0
          maximum: 100
          description: Підсумкова частка повернення, %; не більша за чинну — інакше STATE_CONFLICT.
        reason:
          type: string
          minLength: 1

    AppealRequest:
      type: object
      required: [subject]
      additionalProperties: false
      properties:
        subject:
          type: string
          enum: [BLOCKING, UNPUBLISHING]
          description: 'BLOCKING — блокування; UNPUBLISHING — автоматичне зняття оголошень за FR-14.'
    Appeal:
      type: object
      required: [id, subject, status, decision, reason]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        subject:
          type: string
          enum: [BLOCKING, UNPUBLISHING]
        status:
          type: string
          readOnly: true
          enum: [OPEN, DECIDED]
        decision:
          type: [string, 'null']
          readOnly: true
          enum: [GRANTED, DENIED, null]
        reason:
          type: [string, 'null']
          readOnly: true
    AppealDecisionRequest:
      type: object
      required: [decision, reason]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [GRANTED, DENIED]
        reason:
          type: string
          minLength: 1

    ModerationReasonRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          description: Підстава рішення модератора; журналюється (FR-22).

    EventLogEntry:
      type: object
      required: [timestamp, level, type, userId, bookingId, listingId, correlationId]
      properties:
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Мітка часу в UTC.
        level:
          type: string
          readOnly: true
          enum: [INFO, WARN, ERROR]
        type:
          type: string
          readOnly: true
        code:
          type: [string, 'null']
          readOnly: true
          description: Код відмови для записів WARN (FR-07, PHOTO_INVALID).
        userId:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: Порожній для невдалого входу з неіснуючим email.
        email:
          type: [string, 'null']
          readOnly: true
          description: Введений email — лише для невдалого входу з неіснуючим обліковим записом.
        bookingId:
          type: [string, 'null']
          format: uuid
          readOnly: true
        listingId:
          type: [string, 'null']
          format: uuid
          readOnly: true
        correlationId:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        reason:
          type: [string, 'null']
          readOnly: true
          description: Підстава рішення модератора.
        checkIn:
          type: [string, 'null']
          format: date
          readOnly: true
          description: Запитаний діапазон — для DATES_UNAVAILABLE.
        checkOut:
          type: [string, 'null']
          format: date
          readOnly: true
          description: Запитаний діапазон — для DATES_UNAVAILABLE.
        conflictingBookingIds:
          type: array
          readOnly: true
          description: Для DATES_UNAVAILABLE — усі бронювання, з якими виник конфлікт.
          items:
            $ref: '#/components/schemas/Id'
        conflictReasons:
          type: array
          readOnly: true
          description: |
            Для DATES_UNAVAILABLE: NIGHTS_OVERLAP — перетин ночей; TURNOVER —
            потрапляння в перерву; CLOSED_NIGHT — ніч, закрита власником.
          items:
            type: string
            enum: [NIGHTS_OVERLAP, TURNOVER, CLOSED_NIGHT]

    Notification:
      type: object
      required: [id, text, createdAt]
      properties:
        id:
          allOf: [{ $ref: '#/components/schemas/Id' }]
          readOnly: true
        text:
          type: string
          readOnly: true
        createdAt:
          allOf: [{ $ref: '#/components/schemas/Moment' }]
          readOnly: true

  responses:
    Unauthenticated:
      description: Дія потребує входу
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: urn:rental-is:problem:unauthenticated
                title: Потрібен вхід
                status: 401
                code: UNAUTHENTICATED
                detail: Дія потребує входу в систему.
                correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    NotFound:
      description: Ресурсу немає або його не можна бачити
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            not-found:
              value:
                type: urn:rental-is:problem:not-found
                title: Не знайдено
                status: 404
                code: NOT_FOUND
                detail: Ресурс не існує або недоступний.
                correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    InternalError:
      description: Збій системи
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal-error:
              value:
                type: urn:rental-is:problem:internal-error
                title: Збій системи
                status: 500
                code: INTERNAL_ERROR
                correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f

  examples:
    AccountBlocked:
      value:
        type: urn:rental-is:problem:account-blocked
        title: Обліковий запис заблоковано
        status: 403
        code: ACCOUNT_BLOCKED
        detail: Заблокований користувач може лише входити, бачити свої повідомлення й поїздки і подати оскарження.
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    Forbidden:
      value:
        type: urn:rental-is:problem:forbidden
        title: Дію не дозволено
        status: 403
        code: FORBIDDEN
        detail: Дія не дозволена цій ролі.
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    NotListingOwner:
      value:
        type: urn:rental-is:problem:forbidden
        title: Дію не дозволено
        status: 403
        code: FORBIDDEN
        detail: Дія доступна лише власнику житла.
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    ReasonMissing:
      value:
        type: urn:rental-is:problem:validation-failed
        title: Запит порушує схему
        status: 422
        code: VALIDATION_FAILED
        detail: "reason: обов'язкове поле."
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    DateInvalid:
      value:
        type: urn:rental-is:problem:validation-failed
        title: Запит порушує схему
        status: 422
        code: VALIDATION_FAILED
        detail: 'date: очікується дата YYYY-MM-DD.'
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    StatusParamInvalid:
      value:
        type: urn:rental-is:problem:validation-failed
        title: Запит порушує схему
        status: 422
        code: VALIDATION_FAILED
        detail: "status: обов'язковий параметр зі значенням open."
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    NotPending:
      value:
        type: urn:rental-is:problem:state-conflict
        title: Дія неможлива в поточному стані
        status: 409
        code: STATE_CONFLICT
        detail: Бронювання вже не в статусі PENDING.
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    AlreadyDecided:
      value:
        type: urn:rental-is:problem:state-conflict
        title: Дія неможлива в поточному стані
        status: 409
        code: STATE_CONFLICT
        detail: Звернення вже розглянуто, рішення змінити неможливо.
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    ListingValidationFailed:
      value:
        type: urn:rental-is:problem:validation-failed
        title: Запит порушує схему
        status: 422
        code: VALIDATION_FAILED
        detail: 'maxGuests: ціле число від 1 до 20, отримано 21.'
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    PhotoInvalid:
      value:
        type: urn:rental-is:problem:photo-invalid
        title: Фотографії не відповідають вимогам
        status: 422
        code: PHOTO_INVALID
        detail: Фотографія 1 має розмір 5242881 байт, більше за 5242880.
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    ReviewValidationFailed:
      value:
        type: urn:rental-is:problem:validation-failed
        title: Запит порушує схему
        status: 422
        code: VALIDATION_FAILED
        detail: 'text: від 10 до 1000 символів, отримано 9.'
        correlationId: e3d7b4a6-38f5-446c-9b05-b5c6d7e8f90f
    ListingRequestPodil:
      value:
        title: Поділ
        description: Світла квартира біля Контрактової площі.
        city: Київ
        address: вул. Сагайдачного, 1
        maxGuests: 4
